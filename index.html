<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Space minotaur</title>
    <link rel="stylesheet" href="gamestyles.css">
    <!-- Load Phaser 3 and game scripts (non-module order) -->
    <script src="phaser.js"></script>
    <script src="./src/physics.js"></script>
    <script src="./src/planets.js"></script>
    <script src="./src/gameobjects.js"></script>
    <script src="./src/camera.js"></script>
    <script src="./src/turn_manager.js"></script>
    <script src="./src/game.js"></script>
    <!-- Debug overlay (uncomment to enable debug borders) -->
    <script src="./src/debug_overlay.js"></script>
  </head>
  <body>
    <!-- Game scripts loaded in head so opening the file directly works -->
    <div style="position: relative; width: 100%; height: 100%;" id="game-container" >
      <div id="debug-overlay" style="position: absolute; top: 10; left: 10; pointer-events: none;"></div>
      <!-- Player UI layer: place HUD and interactive buttons here -->
      <div id="player-ui" style="position: absolute; inset: 0; pointer-events: none; z-index:9998;"></div>
    </div>
    <!-- Start menu shown before the game starts -->
    <div id="start-menu" role="dialog" aria-label="Start menu">
      <div class="menu-inner">
        <div id="start-title" class="title">Space Balls</div>
        <div id="start-subtitle" class="subtitle">A tiny space playground, choose an option</div>
        <button id="start-play" class="start-button play">Play</button>
        <button id="start-settings-btn" class="start-button settings">Settings</button>
        <button id="start-exit" class="start-button exit">Exit</button>
        
      </div>
    </div>
  
  <!-- Standalone Settings UI -->
  <div id="settings-ui" role="dialog" aria-hidden="true" style="display:none; position:fixed; inset:0; z-index:120000; align-items:center; justify-content:center; background: rgba(0,0,0,0.7);">
    <div style="background:#071018; color:#e6eef8; padding:18px; border-radius:10px; min-width:360px; max-width:90%;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div id="settings-header-title" style="font-size:18px; font-weight:600;">Settings</div>
        <div style="display:flex; gap:8px;">
          <button id="settings-save" style="padding:8px 12px; background:#10b981; border:none; border-radius:6px; color:#042018; cursor:pointer;">Save</button>
          <button id="settings-back" style="padding:8px 12px; background:#374151; border:none; border-radius:6px; color:#e6eef8; cursor:pointer;">Back to Menu</button>
        </div>
      </div>
      <div id="settings-header-subtitle" style="font-size:13px; color:#9fb0c8; margin-bottom:10px;">Adjust gameplay options below. Save to apply.</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <label id="settings-label-planets" style="color:#cfe6f8">Number of planets</label>
        <input id="settings-planets" type="number" min="0" max="12" value="3" style="padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.02); color:#e6eef8;" />
        <label id="settings-label-players" style="color:#cfe6f8">Number of real players</label>
        <input id="settings-realplayers" type="number" min="1" max="16" value="1" style="padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.02); color:#e6eef8;" />
        <div style="display:flex; gap:8px; align-items:center;">
          <label id="settings-label-language" style="color:#cfe6f8; margin-right:8px;">Language</label>
          <select id="settings-language" style="padding:6px; border-radius:6px; background:rgba(255,255,255,0.02); color:#e6eef8; border:1px solid rgba(255,255,255,0.06);">
            <option value="en">English</option>
            <option value="pt">Português</option>
          </select>
        </div>
      </div>
    </div>
  </div>
    <!-- HTML layer main menu / pause overlay -->
    <div id="main-menu" role="dialog" aria-hidden="true" aria-label="Main menu">
      <div class="menu-inner">
        <h2 id="mainmenu-headerTitle" style="margin:0 0 12px 0;">Paused</h2>
        <div id="mainmenu-headerSubtitle" style="margin-bottom:12px; font-size:14px; color:#9fb0c8">Press Esc to resume</div>
        <button id="menu-resume">Resume</button>
        <button id="menu-restart">Restart</button>
        <button id="menu-settings">Settings</button>
        <button id="menu-exit" style="background:#b91c1c; color:#fff;">Exit to Main Menu</button>
      </div>
    </div>
    <!-- Confirmation modal used for restart/exit actions -->
    <div id="confirm-modal" role="dialog" aria-hidden="true" style="display:none; position:fixed; inset:0; z-index:110000; align-items:center; justify-content:center; background: rgba(0,0,0,0.6);">
      <div style="background:#071018; color:#e6eef8; padding:18px; border-radius:10px; min-width:260px; text-align:center;">
        <div id="confirm-message" style="margin-bottom:12px;">Are you sure?</div>
        <div style="display:flex; gap:8px; justify-content:center;">
          <button id="confirm-yes" style="padding:8px 12px; background:#10b981; border:none; border-radius:6px; color:#042018; cursor:pointer;">Yes</button>
          <button id="confirm-no" style="padding:8px 12px; background:#374151; border:none; border-radius:6px; color:#e6eef8; cursor:pointer;">No</button>
        </div>
      </div>
    </div>
